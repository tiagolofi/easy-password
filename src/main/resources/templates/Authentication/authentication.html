<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Password - Login</title>

    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="login-wrapper">

            <!-- Stage 1 -->
            <div id="stage-selection" class="stage active">
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="fa-solid fa-lock"></i>
                    </div>

                    <h1>Easy Password</h1>
                </div>

                <div class="method-selector">
                    <p class="method-title">
                        Escolha seu método de autenticação
                    </p>

                    <div class="methods-grid">

                        <button
                            type="button"
                            class="method-btn"
                            data-method="TOTP">

                            <div class="method-icon">
                                <i class="fa-regular fa-clock"></i>
                            </div>

                            <div class="method-name">TOTP</div>
                            <div class="method-desc">6 dígitos</div>
                        </button>

                        <button
                            type="button"
                            class="method-btn"
                            data-method="SENHA">

                            <div class="method-icon">
                                <i class="fa-solid fa-key"></i>
                            </div>

                            <div class="method-name">SENHA</div>
                            <div class="method-desc">Tradicional</div>
                        </button>

                    </div>
                </div>
            </div>

            <!-- Stage TOTP -->
            <div id="stage-totp" class="stage">

                <div class="back-button">
                    <button
                        type="button"
                        class="btn-back"
                        onclick="goBack()">

                        ← Voltar
                    </button>
                </div>

                <div class="form-container">

                    <h2>Autenticação TOTP</h2>

                    <form id="totp-form" onsubmit="submitTOTP(event)">

                        <div class="form-group">
                            <label for="username-totp">Usuário</label>

                            <input
                                type="text"
                                id="username-totp"
                                name="username"
                                placeholder="Digite seu usuário"
                                required>
                        </div>

                        <button
                            type="button"
                            class="btn-primary"
                            id="btn-enviar-totp"
                            onclick="enviarCodigoTOTP()">

                            Enviar código
                        </button>

                        <div class="form-group hidden" id="totp-input-group">
                            <label for="totp-code">
                                Digite os 6 dígitos
                            </label>

                            <input
                                type="text"
                                id="totp-code"
                                placeholder="000000"
                                maxlength="6"
                                inputmode="numeric"
                                autocomplete="off"
                                disabled>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Stage SENHA -->
            <div id="stage-senha" class="stage">

                <div class="back-button">
                    <button
                        type="button"
                        class="btn-back"
                        onclick="goBack()">

                        ← Voltar
                    </button>
                </div>

                <div class="form-container">

                    <h2>Autenticação por Senha</h2>

                    <form id="senha-form" onsubmit="submitSenha(event)">
                        <input type="hidden" name="{inject:csrf.headerName}" value="{inject:csrf.token}" />
                        <div class="form-group">

                            <label for="username-senha">
                                Usuário
                            </label>

                            <input
                                type="text"
                                id="username-senha"
                                name="username"
                                placeholder="Digite seu usuário"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="form-group">

                            <label for="password-senha">
                                Senha
                            </label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password-senha"
                                    name="password"
                                    placeholder="Digite sua senha"
                                    autocomplete="current-password"
                                    required>

                                <button
                                    type="button"
                                    class="toggle-password"
                                    onclick="togglePasswordVisibility('password-senha')">

                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>

                        <button
                            type="submit"
                            class="btn-primary">

                            Entrar
                        </button>

                    </form>
                </div>
            </div>

            <div id="error-message" class="error-message"></div>

        </div>
    </div>

    <script src="/login.js"></script>
</body>

</html>
