<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Password - Home</title>
    <link rel="stylesheet" href="/home.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="header-title">
                    <div class="logo-icon-header">🔐</div>
                    <h1>Easy Password</h1>
                </div>
                <div class="header-actions">
                    <button type="button" class="btn-logout" onclick="logout()">Sair</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="items-section">
                <div class="section-header">
                    <h2>Seus Serviços</h2>
                    <button type="button" class="btn-add-item" onclick="addNewItem()">+ Adicionar</button>
                </div>

                <div id="items-container" class="items-container">
                    {#if items.size > 0}
                        {#each items}
                            <div class="item-card" data-service="{it.service}">
                                <div class="item-header">
                                    <div class="item-service">
                                        <span class="service-icon">🔒</span>
                                        <span>{it.service}</span>
                                    </div>
                                    <div class="item-actions">
                                        <button type="button" class="item-action-btn" onclick="editItem('{it.service}')" title="Editar">
                                            ✏️ Editar
                                        </button>
                                        <button type="button" class="item-action-btn" onclick="deleteItem('{it.service}')" title="Deletar">
                                            🗑️ Deletar
                                        </button>
                                    </div>
                                </div>

                                <div class="item-password-section">
                                    <label class="password-label">Senha</label>
                                    <div class="password-container">
                                        <div class="password-display">
                                            <span class="password-hidden" id="password-text-{it.service}">••••••••</span>
                                        </div>

                                        <button type="button"
                                                class="toggle-visibility"
                                                id="toggle-{it.service}"
                                                onclick="togglePasswordVisibility('{it.service}')"
                                                title="Mostrar/Ocultar">
                                            👁️
                                        </button>

                                        <!-- ✅ BOTÃO CORRIGIDO -->
                                        <button type="button"
                                                class="view-original-btn"
                                                id="view-{it.service}"
                                                onclick="openPinModal('{it.service}', document.getElementById('password-value-{it.service}').value)"
                                                title="Exibir Senha Original">
                                            🔓
                                        </button>

                                        <button type="button"
                                                class="copy-btn"
                                                onclick="copyToClipboard('{it.service}')"
                                                title="Copiar para Área de Transferência">
                                            📋
                                        </button>
                                    </div>
                                </div>

                                <!-- senha criptografada -->
                                <input type="hidden"
                                       id="password-value-{it.service}"
                                       value="{it.password.encrypt()}">
                            </div>
                        {/each}
                    {#else}
                        <div class="empty-state">
                            <span class="empty-state-icon">📭</span>
                            <p class="empty-state-text">Nenhum serviço cadastrado</p>
                            <p class="empty-state-subtext">Comece a adicionar suas senhas agora</p>
                            <button type="button" class="btn-add-item" onclick="addNewItem()">+ Adicionar Serviço</button>
                        </div>
                    {/else}
                    {/if}
                </div>
            </section>
        </main>
    </div>

    <!-- Modal adicionar item -->
    <div id="add-item-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Adicionar Novo Serviço</h3>
                <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
            </div>

            <form id="add-item-form" onsubmit="submitNewItem(event)">
                <div class="form-group">
                    <label for="service-input">Nome do Serviço</label>
                    <input type="text"
                           id="service-input"
                           name="service"
                           placeholder="ex: Gmail, GitHub"
                           required>
                </div>

                <div class="form-group">
                    <label for="password-input">Senha</label>
                    <input type="password"
                           id="password-input"
                           name="password"
                           placeholder="Digite a senha"
                           required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ✅ MODAL PIN -->
    <div id="pin-modal" class="modal">
        <div class="modal-content modal-pin">
            <div class="modal-header">
                <h3>Segurança - Insira seu PIN</h3>
                <button type="button" class="modal-close" onclick="closePinModal()">&times;</button>
            </div>

            <form onsubmit="validatePinAndDecrypt(event)">
                <div class="form-group">
                    <label for="pin-input">PIN de 4 dígitos</label>

                    <input type="password"
                           id="pin-input"
                           name="pin"
                           placeholder="••••"
                           maxlength="4"
                           inputmode="numeric"
                           required>

                    <p class="pin-help">Digite apenas números</p>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closePinModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Validar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/home.js"></script>
</body>
</html>
