<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Password - Login</title>
    <link rel="stylesheet" href="/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper">

            <!-- Stage 1 -->
            <div id="stage-selection" class="stage active">
                <div class="logo-area">
                    <div class="logo-icon">🔐</div>
                    <h1>Easy Password</h1>
                </div>

                <div class="method-selector">
                    <p class="method-title">Escolha seu método de autenticação</p>

                    <div class="methods-grid">
                        <button class="method-btn" data-method="TOTP">
                            <div class="method-icon">⏱️</div>
                            <div class="method-name">TOTP</div>
                            <div class="method-desc">6 dígitos</div>
                        </button>

                        <button class="method-btn" data-method="SENHA">
                            <div class="method-icon">🔑</div>
                            <div class="method-name">SENHA</div>
                            <div class="method-desc">Tradicional</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stage TOTP -->
            <div id="stage-totp" class="stage">
                <div class="back-button">
                    <button class="btn-back" onclick="goBack()">← Voltar</button>
                </div>

                <div class="form-container">
                    <h2>Autenticação TOTP</h2>

                    <form id="totp-form">
                        <div class="form-group">
                            <label for="totp-input">Digite os 6 dígitos</label>
                            <input 
                                type="text" 
                                id="totp-input"
                                placeholder="000000"
                                maxlength="6"
                                required
                                inputmode="numeric"
                                autocomplete="off"
                            >
                            <div class="input-underline"></div>
                        </div>

                        <button type="button" class="btn-primary" onclick="enviarCodigoTOTP()">
                            Enviar código
                        </button>
                    </form>
                </div>
            </div>

            <!-- Stage SENHA -->
            <div id="stage-senha" class="stage">
                <div class="back-button">
                    <button class="btn-back" onclick="goBack()">← Voltar</button>
                </div>

                <div class="form-container">
                    <h2>Autenticação por Senha</h2>

                    <form id="password-form">
                        <div class="form-group">
                            <label for="username-input">Usuário</label>
                            <input type="text" id="username-input" required>
                        </div>

                        <div class="form-group">
                            <label for="password-input">Senha</label>
                            <div class="password-wrapper">
                                <input type="password" id="password-input" required>
                                <button type="button" onclick="togglePasswordVisibility()" aria-label="Mostrar senha">
                                    <i id="eye-icon" class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary">Entrar</button>
                    </form>
                </div>
            </div>

            <div id="error-message" class="error-message"></div>
        </div>
    </div>

    <script src="/login.js"></script>
</body>
</html>
